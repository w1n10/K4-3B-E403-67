<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    
    <!-- Pastel Background Gradient -->
    <linearGradient id="bgPastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="35%" stop-color="#FFE5E7"/>
      <stop offset="70%" stop-color="#FFD3D6"/>
      <stop offset="100%" stop-color="#F9DCC0"/>
    </linearGradient>

    <!-- Dark Luxury Background Gradient -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1710"/>
      <stop offset="50%" stop-color="#1F0D07"/>
      <stop offset="100%" stop-color="#140703"/>
    </linearGradient>

    <!-- Deep Espresso Gradient for Max Contrast -->
    <linearGradient id="darkEspresso" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E2016"/>
      <stop offset="40%" stop-color="#26130C"/>
      <stop offset="100%" stop-color="#140804"/>
    </linearGradient>

    <!-- Vibrant Coral-Peach Ribbon Gradient -->
    <linearGradient id="coralPeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B7A"/>
      <stop offset="45%" stop-color="#FF9EA7"/>
      <stop offset="85%" stop-color="#FFC6CA"/>
      <stop offset="100%" stop-color="#F9DCC0"/>
    </linearGradient>

    <!-- Glowing AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5264"/>
      <stop offset="50%" stop-color="#FFA48F"/>
      <stop offset="100%" stop-color="#FDE1C5"/>
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#FFC6CA" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F9DCC0" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="shadowElevated" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26130C" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#26130C" flood-opacity="0.12"/>
    </filter>

    <filter id="shadowCoral" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF6B7A" flood-opacity="0.32"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8F8"/>
      <stop offset="30%" stop-color="#FFE5E7"/>
      <stop offset="65%" stop-color="#FFD3D6"/>
      <stop offset="90%" stop-color="#FFC6CA" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F9DCC0"/>
    </linearGradient>
    <!-- Cắt mọi vệt sáng trang trí theo đúng hình thẻ bo góc -->
    <clipPath id="cardClip">
      <rect x="5" y="5" width="950" height="250" rx="28"/>
    </clipPath>
  </defs>

  <!-- Outer Rounded Banner Card -->
  <rect x="5" y="5" width="950" height="250" rx="28" fill="url(#bannerBg)"/>
  <rect x="5" y="5" width="950" height="250" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Ambient Light Orbs from the Palette -->
  <circle cx="80" cy="60" r="100" fill="#FFFFFF" opacity="0.65" filter="url(#softGlow)"/>
  <circle cx="880" cy="200" r="110" fill="#F9DCC0" opacity="0.55" filter="url(#softGlow)"/>
  <circle cx="560" cy="50" r="70" fill="#FFB0B5" opacity="0.3" filter="url(#softGlow)"/>

  <!-- Modern Geometric Wave Ribbons on Right Edge -->
  <path d="M 720 5 C 800 60, 840 180, 955 120 L 955 5 Z" fill="#FFE5E7" opacity="0.5"/>
  <path d="M 760 255 C 820 180, 890 210, 955 160 L 955 255 Z" fill="#F9DCC0" opacity="0.45"/>

  <!-- LEFT: LOGO EMBLEM (Framed Squircle Icon) -->
  <g transform="translate(45, 30)">
    <!-- Small Icon Frame -->
    <rect x="0" y="0" width="200" height="200" rx="46" fill="#FFF5F6" stroke="#FFFFFF" stroke-width="2.5" filter="url(#shadowElevated)"/>
    <rect x="0" y="0" width="200" height="200" rx="46" fill="none" stroke="#FFC6CA" stroke-width="1.5"/>
    
    <!-- Emblem inside Frame -->
    <g transform="translate(18, 14) scale(0.68)">
      
  <!-- EMBLEM GROUP (V + Book + AI Star) -->
  <g class="vlearn-emblem" filter="url(#shadowElevated)">
    <!-- Base Open Knowledge Arc / Book Pages -->
    <path d="M 40 182 
             C 75 198, 105 198, 120 184 
             C 135 198, 165 198, 200 182
             C 192 195, 155 208, 120 196
             C 85 208, 48 195, 40 182 Z" 
          fill="url(#coralPeach)" opacity="0.85"/>

    <!-- Neural Learning Loop (Dotted Synapse Line) -->
    <path d="M 52 176 Q 120 204 188 176" 
          fill="none" stroke="#FF8A95" stroke-width="2.5" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.9"/>
    
    <!-- LEFT PILLAR of 'V' (Knowledge Spine - Deep Espresso for Bold Contrast) -->
    <!-- Solid base shadow layer -->
    <path d="M 48 42
             C 38 42, 32 52, 37 62
             L 106 178
             C 112 188, 128 188, 134 178
             L 150 152
             L 100 60
             C 95 50, 84 42, 70 42
             Z"
          fill="url(#darkEspresso)"/>

    <!-- Inner 3D Bevel Highlight on Left Stem -->
    <path d="M 46 50 L 112 168" stroke="#552D20" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- RIGHT PILLAR of 'V' (Adaptive AI Flame / Ribbon - Coral-Peach Gradient) -->
    <g filter="url(#shadowCoral)">
      <path d="M 106 178
               C 112 188, 128 188, 134 178
               L 194 62
               C 199 52, 191 42, 180 42
               C 169 42, 159 49, 154 58
               L 120 126
               L 96 160
               Z"
            fill="url(#coralPeach)"/>
    </g>

    <!-- Intersecting Mobius Learning Fold (Apex Connection) -->
    <path d="M 106 178 L 134 178 L 120 152 Z" fill="#FF5264" opacity="0.95"/>

    <!-- TEACHABLE AI SPARKLE (4-Point Brilliant Star) -->
    <g transform="translate(196, 38)" filter="url(#shadowCoral)">
      <path d="M 0 -22 
               Q 0 0, 22 0 
               Q 0 0, 0 22 
               Q 0 0, -22 0 
               Q 0 0, 0 -22 Z" 
            fill="url(#sparkleGrad)"/>
      <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Teachable Feedback Sparkle (Small Insight Star) -->
    <g transform="translate(34, 105)">
      <path d="M 0 -11 Q 0 0, 11 0 Q 0 0, 0 11 Q 0 0, -11 0 Q 0 0, 0 -11 Z" 
            fill="url(#coralPeach)" opacity="0.9"/>
      <circle cx="0" cy="0" r="2" fill="#FFFFFF"/>
    </g>

    <!-- Synapse Data Nodes -->
    <circle cx="48" cy="184" r="4" fill="#26130C"/>
    <circle cx="120" cy="196" r="4.5" fill="#FF6B7A"/>
    <circle cx="192" cy="184" r="4" fill="#F9DCC0"/>
  </g>

    </g>
  </g>

  <!-- RIGHT: FULL SYSTEM TYPOGRAPHY -->
  <g transform="translate(280, 0)">
    <!-- System Badge / Category Chip -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="232" height="28" rx="14" fill="#26130C" opacity="0.08"/>
      <rect x="0" y="0" width="232" height="28" rx="14" fill="none" stroke="#26130C" stroke-width="1" stroke-opacity="0.15"/>
      <circle cx="14" cy="14" r="4.5" fill="#FF5264"/>
      <text x="26" y="18" 
            font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
            font-size="10.5" 
            font-weight="800" 
            letter-spacing="2.5" 
            fill="#3E2016">AI LEARNING SYSTEM</text>
    </g>

    <!-- Main Title: VLearn -->
    <text x="0" y="132" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="-1.2" 
          fill="url(#darkEspresso)">VLearn<tspan fill="#FF5264">.</tspan></text>

    <!-- Full System Subtitle: TEACHABLE LEARNER -->
    <text x="2" y="174" 
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="7" 
          fill="#4A251B">TEACHABLE LEARNER</text>

    <!-- Tagline / Descriptor -->
    <text x="3" y="206" 
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="0.5" 
          fill="#7C4B3E" 
          opacity="0.9">Adaptive Intelligence • Interactive Knowledge Framework</text>
  </g>

  <!-- Decorative Sparkles on the Banner -->
  <g transform="translate(870, 70)" filter="url(#shadowCoral)">
    <path d="M 0 -18 Q 0 0, 18 0 Q 0 0, 0 18 Q 0 0, -18 0 Q 0 0, 0 -18 Z" fill="url(#sparkleGrad)"/>
  </g>
  <circle cx="910" cy="120" r="3.5" fill="#FF6B7A" opacity="0.8"/>
  <circle cx="830" cy="40" r="4.5" fill="#F9DCC0"/>
</svg>